name: tests

# Runs the fast test suite on every push and pull request. The slow checks (RUN_SLOW=1) and the many-seed
# edge check (`python edge.py 40 2 <fresh seed>`) are run by hand before changing prices, news or fees.
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run the tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover tests -v 2>&1 | tee test.log
      - name: List what failed (shown on the run's summary page)
        if: always()
        shell: bash
        run: |
          {
            echo '## Test result'
            echo '```'
            grep -E "^(Ran |OK|FAILED)" test.log || echo "no summary line: the run stopped early"
            echo '```'
            echo '### Failures and errors'
            echo '```'
            grep -E -A14 "^(FAIL|ERROR): " test.log | head -200 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
