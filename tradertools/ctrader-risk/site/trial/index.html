<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exact Risk Ticket (trial)</title>
<link rel="stylesheet" href="../app.css">
</head>
<body data-edition="trial">
<main id="app">
  <header class="top">
    <div class="symrow"><input id="sym" aria-label="Symbol" autocomplete="off" spellcheck="false"><span id="px" class="mut"></span></div>
    <div id="acct" class="mut">Connecting to cTrader...</div>
  </header>
  <p id="banner" class="banner" hidden></p>

  <section class="card" id="ticket">
    <div class="seg" role="group" aria-label="Side">
      <button type="button" data-side="buy" class="on">Buy</button><button type="button" data-side="sell">Sell</button>
    </div>
    <div class="grid">
      <label for="otype">Order</label>
      <select id="otype"><option value="market">Market</option><option value="limit">Limit</option><option value="stop">Stop</option></select>
      <label for="entry" class="entry-row" hidden>Entry price</label>
      <input id="entry" class="entry-row" inputmode="decimal" hidden>
      <label for="stop">Stop</label>
      <div class="pair"><input id="stop" inputmode="decimal"><select id="stop-unit" aria-label="Stop in"><option value="price">price</option><option value="pips">pips</option></select></div>
      <label for="target">Target</label>
      <div class="pair"><input id="target" inputmode="decimal" placeholder="none"><select id="target-unit" aria-label="Target in"><option value="price">price</option><option value="r">x risk</option></select></div>
      <label for="risk">Risk</label>
      <div class="pair"><input id="risk" inputmode="decimal"><select id="risk-mode" aria-label="Risk as"><option value="percent">% of balance</option><option value="money">money</option></select></div>
    </div>
  </section>

  <section class="card out" id="result" aria-live="polite"></section>
  <button type="button" id="review" class="go wide" disabled>Review order</button>

  <section class="card" id="reviewbox" hidden>
    <h2>Check before sending</h2>
    <dl id="review-list"></dl>
    <p class="mut small">A stop is a price level, not a guaranteed price: slippage, gaps and commission can make a loss larger than shown.</p>
    <p id="review-note" class="note" hidden></p>
    <div class="buttons"><button type="button" id="place" class="go">Place order</button><button type="button" id="back">Back</button></div>
    <p id="place-msg" aria-live="assertive"></p>
  </section>

  <details class="card" id="limits">
    <summary>Loss limits <span id="light-day" class="light" hidden></span><span id="light-total" class="light" hidden></span></summary>
    <div class="grid">
      <label for="lim-day">Daily loss limit</label><input id="lim-day" inputmode="decimal" placeholder="off">
      <label for="lim-hour">Day starts at</label><select id="lim-hour"></select>
      <label for="lim-total">Total loss limit</label><input id="lim-total" inputmode="decimal" placeholder="off">
      <label for="lim-start">From a balance of</label><input id="lim-start" inputmode="decimal">
    </div>
    <p id="limits-out" class="mut small"></p>
  </details>

  <details class="card" id="logbox">
    <summary>Trade log</summary>
    <p id="log-sum" class="mut small"></p>
    <table id="log"><tbody></tbody></table>
  </details>

  <footer class="mut small"><span id="edition"></span> · No signals, no advice. Try it on a demo account first. · <span id="version"></span></footer>
</main>
<script type="module" src="../js/app.js"></script>
</body>
</html>
