const icon=k=>`<svg class="ic" viewBox="0 0 84 84">${ICON[k]||ICON.idea}</svg>`;
function sceneAt(t){let i=0;for(let k=0;k<SC.length;k++)if(t>=SC[k].t0-1e-3)i=k;return i}
// ---- the chart state at time t: what is revealed, the window and the drawings, eased so nothing jumps
function chartState(i,t){

 (s.cues||[]).filter(c=>c.do==='zoom').forEach(c=>{const z=io(seg(t,c.t,c.t+.9));w=[lerp(w[0],c.from,z),lerp(w[1],c.to,z)]});

 (s.cues||[]).filter(c=>c.do==='reveal').forEach(c=>r=Math.min(C.length-1,c.to));if(s.kind==='answer'&&s.reveal_to!=null)r=Math.max(r,s.reveal_to);return r}

function drawChart(i,t){

 const short=k=>k<0||SC[k].kind==='stick'||SC[k].kind==='question'||(SC[k].kind==='answer'&&k>0&&SC[k-1].kind==='question'),hh0=k=>short(k)?620:740,

 {const k=rr+1,gg=r-Math.floor(r);if(k<n&&k<=Math.ceil(w1)&&gg>0){const [o,h,l,c]=C[k],e=out(gg),cc=lerp(o,c,e);   // the growing candle moves the scale with it

 const pad=(hi-lo)*.1,mk=DA.filter(d=>d.do==='mark'&&d.side!=='vol');lo-=pad*(mk.some(d=>d.side==='low')?2.6:1);hi+=pad*(mk.some(d=>d.side!=='low')?2.6:1);   // (room for the markers)

 const vv=[];for(let k=Math.max(0,Math.floor(w0));k<=Math.min(n-1,Math.ceil(w1),Math.floor(r));k++)vv.push(C[k][4]);vv.sort((a,b)=>a-b);const vmax=Math.max(1,2.2*(vv[vv.length>>1]||1));
 let post='',g=`<g opacity="${fade}"><defs><clipPath id="cp"><rect x="${PL.x-6}" y="${B.y+50}" width="${PL.w+12}" height="${B.h-60}"/></clipPath></defs>`;

 for(let q=0;q<5;q++){const v=lerp(lo+(hi-lo)*.1,hi-(hi-lo)*.1,q/4);g+=`<line x1="${PL.x}" x2="${PL.x+PL.w}" y1="${Y(v)}" y2="${Y(v)}" stroke="#151a1f" stroke-width="2"/><text x="${PL.x+PL.w+16}" y="${Y(v)+8}" font-size="24" fill="${MUTE}">${v.toFixed(2)}</text>`}

 for(let k=Math.max(0,Math.floor(w0)-1);k<=Math.min(n-1,Math.ceil(w1)+1);k++){if(k>r+.999)break;const [o,h,l,c,v]=C[k],gg=cl(r-k+1),up=c>=o,col=up?G:RD,x=X(k),bwid=Math.max(2,bw*.64),cc=lerp(o,c,out(gg));
  const hh=Math.max(o,cc)+(h-Math.max(o,c))*gg,ll=Math.min(o,cc)-(Math.min(o,c)-l)*gg,vh=Math.min(1,v/vmax)*VOL.h*out(gg);

 D.filter(d=>d.do==='line').forEach(d=>{const col=TONE[d.tone]||AM,a=out(seg(d.age,0,.6)),y=Y(d.price);g+=`<line x1="${PL.x}" x2="${PL.x+(PL.w-16)*a}" y1="${y}" y2="${y}" stroke="${col}" stroke-width="4" stroke-dasharray="16 10"/>`;
  if(d.label){const lw=d.label.length*18+34,c2=[[PL.x+8,y-52],[PL.x+PL.w-lw-8,y-52],[PL.x+8,y+8],[PL.x+PL.w-lw-8,y+8]],[lx,ly]=c2.find(([u,v])=>free(u-4,v-6,u+lw+4,v+50))||c2[0];taken.push([lx,ly,lx+lw,ly+44]);   // (close lines: their tags go to opposite ends)

  const c2=(ys||[y]).flatMap(v=>[0,pw/2+28,-pw/2-28].map(dx=>at(x+dx,v))),[px,py]=c2.find(([u,v])=>free(u-pw/2-6,v-29,u+pw/2+6,v+29))||at(x,y);

 D.filter(d=>d.do==='mark'&&d.side==='vol').forEach(d=>{const k=Math.max(0,Math.min(n-1,d.i)),a=back(seg(d.age,0,.45)),col=TONE[d.tone]||AM,ks=C.slice(Math.max(0,k-20),k),avg=ks.reduce((p,c)=>p+c[4],0)/Math.max(1,ks.length),ya=VOL.y+VOL.h-Math.min(1,avg/vmax)*VOL.h,vh=Math.min(1,C[k][4]/vmax)*VOL.h,x=X(k),bwid=Math.max(4,bw*.64)+10;

// ---- background: two slow glows, so even a still scene breathes
function drawBg(t){return;document.getElementById('bg').innerHTML=`<defs><radialGradient id="g1"><stop offset="0" stop-color="#4fc6c8" stop-opacity=".10"/><stop offset="1" stop-color="#4fc6c8" stop-opacity="0"/></radialGradient><radialGradient id="g2"><stop offset="0" stop-color="#3dd68c" stop-opacity=".07"/><stop offset="1" stop-color="#3dd68c" stop-opacity="0"/></radialGradient></defs>
