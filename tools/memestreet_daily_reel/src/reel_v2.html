<html><head><meta charset="utf-8">

<style>

<script>
const R=window.__R,SC=R.scenes,CH=R.charts||[];

const icon=k=>`<svg class="ic" viewBox="0 0 84 84">${ICON[k]||ICON.idea}</svg>`;
function sceneAt(t){let i=0;for(let k=0;k<SC.length;k++)if(t>=SC[k].t0-1e-3)i=k;return i}
// ---- the chart state at time t: what is revealed, the window and the drawings, eased so nothing jumps
function chartState(i,t){

 if(i===0&&s.kind==='hook'){const k0=Math.max(1,r-8);r=lerp(k0,r,out(seg(t,.05,1.3)))}   // (v2: the newest candles replay in the first second: motion from frame 1)

 let w=P?[lerp(P[0],W[0],u),lerp(P[1],W[1],u)]:W.slice();
 (s.cues||[]).filter(c=>c.do==='zoom').forEach(c=>{const z=io(seg(t,c.t,c.t+.9));w=[lerp(w[0],c.from,z),lerp(w[1],c.to,z)]});
 const drift=seg(t,s.t0,s.t1)*Math.min(4,(w[1]-w[0])*.04);w=[w[0]+drift,w[1]];

function endReveal(i){const s=SC[i],C=CH[s.chart].candles;let r=s.show!=null?s.show:(i>0&&SC[i-1].chart===s.chart?endReveal(i-1):C.length-1);
 (s.cues||[]).filter(c=>c.do==='reveal').forEach(c=>r=Math.min(C.length-1,c.to));if(s.kind==='answer'&&s.reveal_to!=null)r=Math.max(r,s.reveal_to);return r}

 const out=[];let k=i;while(k>=0&&SC[k].chart===SC[i].chart){(SC[k].cues||[]).forEach(c=>{if(['line','mark','shade'].includes(c.do))out.push(Object.assign({},c,{age:k===i?t-c.t:9}))});if(!SC[k].carry)break;k--}

function drawChart(i,t){

 const {C,n,r,w,s,r0}=S,show=s.kind==='cards'||s.kind==='big'?0:1,fade=out(seg(t,s.t0-.05,s.t0+.35));
 const short=k=>k<0||SC[k].kind==='stick'||SC[k].kind==='question'||(SC[k].kind==='answer'&&k>0&&SC[k-1].kind==='question'),hh0=k=>short(k)?620:740,
  bh=i>0&&SC[i-1].chart===s.chart?lerp(hh0(i-1),hh0(i),io(seg(t,s.t0,s.t0+.6))):hh0(i);   // (eased, so the chart never jumps)
 const hasVol=SC.some(q=>q.chart===s.chart&&(q.cues||[]).some(c=>c.do==='mark'&&c.side==='vol'));   // (the references show no volume unless it is the point)
 const B={x:30,y:545,w:s.kind==='stick'?720:1020,h:bh},PL={x:B.x+10,y:B.y+56,w:B.w-162,h:hasVol?bh-170:bh-80},VOL={y:B.y+bh-105,h:hasVol?85:0};

 for(let k=Math.max(0,Math.floor(w0));k<=rr;k++){lo=Math.min(lo,C[k][2]);hi=Math.max(hi,C[k][1])}
 {const k=rr+1,gg=r-Math.floor(r);if(k<n&&k<=Math.ceil(w1)&&gg>0){const [o,h,l,c]=C[k],e=out(gg),cc=lerp(o,c,e);   // the growing candle moves the scale with it

 const DA=drawings(i,1e9);   // (every line and mark of the scene, drawn yet or not, sets the scale: nothing jumps when one lands)
 DA.filter(d=>d.do==='line').forEach(d=>{lo=Math.min(lo,d.price);hi=Math.max(hi,d.price)});
 const pad=(hi-lo)*.1,mk=DA.filter(d=>d.do==='mark'&&d.side!=='vol');lo-=pad*(mk.some(d=>d.side==='low')?2.6:1);hi+=pad*(mk.some(d=>d.side!=='low')?2.6:1);   // (room for the markers)

 let post='',g=`<g opacity="${fade}"><defs><clipPath id="cp"><rect x="${PL.x-6}" y="${B.y+50}" width="${PL.w+12}" height="${B.h-60}"/></clipPath></defs>`;
 g+=`<g clip-path="url(#cp)">`;   // (no panel: the chart sits straight on the page, full width, like the references)
 const D=drawings(i,t),taken=[],free=(a,b,c,d)=>!taken.some(q=>a<q[2]&&q[0]<c&&b<q[3]&&q[1]<d);   // (every tag's box: a new tag never lands on one)
 {const k=Math.min(n-1,Math.floor(r));if(k>=0){const x=X(k),yc=Y(C[k][3]);taken.push([x-bw,Y(C[k][1])-8,x+bw,Y(C[k][2])+8],[PL.x+PL.w-40,yc-30,PL.x+PL.w+140,yc+30])}}   // (the newest candle and the price tag stay clear of tags)

 const clear=(a,b,c,d)=>free(a,b,c,d)&&!cb.some(q=>a<q[2]&&q[0]<c&&b<q[3]&&q[1]<d);   // (a tag off the candles where one fits: on them it hides the price)

 for(let k=Math.max(0,Math.floor(w0)-1);k<=Math.min(n-1,Math.ceil(w1)+1);k++){if(k>r+.999)break;const [o,h,l,c,v]=C[k],gg=cl(r-k+1),up=c>=o,col=up?G:RD,x=X(k),bwid=Math.max(3,bw*.72),cc=lerp(o,c,out(gg));
