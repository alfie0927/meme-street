<!-- Meme Street's 23:30 daily reel, "Your $1,000" (2026-11-27, after the owner: "i hate these daily reels ... remake them ...
     WAY better ... change the whole vibe"). Built from the hooks skill: frame 0 is the viewer's own money, not a chart (a chart
     with a voice is what a finance viewer has just scrolled past); the live "your $1,000" counter is the stake and the finish
     line; every sentence is its own fast collage beat (a clipping, a phone notification, a number that slams, the real chart
     drawing, the product in 3D, a stamp), cut every 1.5 to 3 s. A HyperFrames composition: GSAP moves the beats in, hf-seek
     draws everything that is a function of time (counters, the chart, captions, grain, the 3D product).
     Its data is window.__R (studio.py: props + the voice's word times). -->

<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="40" data-width="1080" data-height="1920" data-fps="30">
  <canvas id="bg" width="540" height="960"></canvas>
  <div id="cam">

    <div id="beats"></div>
  </div>
  <div id="tag" class="clip0"></div>
  <div id="money"><span class="lbl">YOUR MONEY</span><span class="val">$100,000</span><span class="chg">0%</span></div>
  <div id="caps"></div>
  <div id="vote"></div>
  <div id="flash"></div>
  <canvas id="grain" width="360" height="640" style="opacity:.10;mix-blend-mode:overlay"></canvas>
</div>
<script src="vendor/gsap.min.js"></script>
<script src="vendor/three.min.js"></script>
<script src="vendor/models3d.js"></script>
<script>
(function () {

  v.appendChild(el('div', 'kicker', 'COMMENT A OR B ↓', {top: '1110px', color: 'var(--gold)', fontSize: '62px'})); v.appendChild(el('div', 'kicker', 'memestreet.net', {top: '1200px', fontSize: '46px', letterSpacing: '.08em'}));
  const mid = el('div', 'kicker', 'NEW MYSTERY CHART AT MIDNIGHT', {top: '400px', color: 'var(--ink)', background: 'var(--gold)', width: '760px', left: '160px', borderRadius: '999px', padding: '14px 0', fontSize: '44px', letterSpacing: '.08em'}); v.appendChild(mid);
  tl.from(v, {opacity: 0, duration: .35}, vs); tl.from(mid, {scale: 0, duration: .4, ease: 'back.out(2)'}, t0(CUT.length - 1)); EV.push([vs, 'whoosh'], [vs + .9, 'ding'], [t0(CUT.length - 1), 'pop']);

// ---------------------------------------------------------------- the beats
const P_ = () => R.prices, valAt = f => { const P = P_(), x = cl(f) * (P.length - 1), i = Math.min(P.length - 2, Math.floor(x)); return (R.base || 100000) * lerp(P[i], P[i + 1], x - i) / P[0]; };

function build(B, tl) {
  const s = B.s, d = B.d, k = s.kind;
  if (k === 'hook') {          // frame 0: the viewer's $1,000 in big type, the two sides of the contrast written above it, the hidden chart behind
    const w = el('div', null, null, {position: 'absolute', inset: 0}); d.appendChild(w);

    for (const [x, y, r] of [[-40, -26, -8], [640, -22, 6]]) c.appendChild(el('div', 'tape', null, {left: x + 'px', top: y + 'px', transform: `rotate(${r}deg)`})); d.appendChild(c);

  } else if (k === 'notify') {

    (s.items || []).forEach((it, j) => { const t = j === 0 ? B.a + .12 : it.on ? Math.max(B.a + .6, R._wordT(B.i, it.on)) : B.a + .15 + j * .5, nb = el('div', 'note', `<div class="app"><span class="ico" style="background:${it.color || 'var(--brand)'}">${it.icon || '!'}</span>${it.app || 'NEWS'}<span style="margin-left:auto">now</span></div><div class="ttl">${it.title}</div>${it.body ? `<div class="bdy">${it.body}</div>` : ''}`, {top: 520 + j * 250 + 'px'});
      w.appendChild(nb); tl.from(nb, {y: -260, opacity: 0, scale: .92, duration: .38, ease: 'back.out(1.6)'}, t); EV.push([t, 'ding']); });
  } else if (k === 'big') {
    const c = el('div', 'big', `<div class="num" style="color:${s.color || '#fff'}">0</div><div class="sub">${s.label || ''}</div>`, {top: (s.vs ? 470 : 620) + 'px'}); d.appendChild(c);

      for (const [lab, v, col] of [[s.vsLabel, s.vs, 'rgba(255,255,255,.28)'], [s.label2 || '', s.to, s.color || 'var(--down)']]) { const b = el('div', 'bar', `<div class="fill" style="background:${col};width:0"></div><div class="bl">${lab}</div>`); bars.appendChild(b); } }
    B.parts = {num: c.querySelector('.num'), bars, t: R._wordT(B.i, s.on)}; EV.push([B.a + .1, 'rise'], [Math.max(B.a + .7, B.parts.t + .15), 'ding']);
  } else if (k === 'name') {
    d.appendChild(el('div', 'kicker', s.kicker || 'IT WAS', {top: '400px'})); const nm = el('div', 'name', s.text, {top: '470px', color: 'var(--brand)'}); d.appendChild(nm);
    d.appendChild(el('div', 'kicker', s.sub || '', {top: '1225px', fontSize: '46px', letterSpacing: '.06em'})); tl.from(nm, {scale: 2.4, opacity: 0, duration: .34, ease: 'back.out(1.8)'}, B.a); EV.push([B.a, 'boom'], [B.a + .1, 'sparkle']);

    (s.msgs || []).forEach((m, j) => { const t = j === 0 ? B.a + .15 : m.on ? Math.max(B.a + .5 + j * .3, R._wordT(B.i, m.on)) : B.a + .3 + j * .7, b = el('div', 'bub ' + (m.me ? 'me' : 'them'), (m.who ? `<span class="who">${m.who}</span>` : '') + m.text); w.appendChild(b);

    [...r.children].forEach((c, j) => { const t = B.a + .2 + j * Math.min(.55, (B.b - B.a - .8) / (r.children.length + 1)); tl.from(c, {opacity: 0, y: -14, duration: .25, ease: 'power2.out'}, t); EV.push([t, 'tick']); });

    [...q.querySelectorAll('.qw')].forEach((w, j) => tl.from(w, {opacity: 0, y: 24, duration: .35, ease: 'power2.out'}, B.a + .2 + j * .09)); EV.push([B.a + .1, 'paper']);

function drawChart(x, f0, f1, k, t, whole) {      // the real line from f0 to f1 (drawn up to k of the way), the money it would be, a dot riding the end

// ---------------------------------------------------------------- one frame
function seek(t, cover) {

  for (const [k, x0, y0, r] of [[0, 120, 180, 420], [1, 430, 760, 480]]) { const x = x0 + 60 * Math.sin(t * .4 + k * 2), y = y0 + 50 * Math.cos(t * .33 + k), g = bg.createRadialGradient(x, y, 10, x, y, r); g.addColorStop(0, k ? (TH.glow2 || 'rgba(255,200,61,.10)') : (TH.glow || (R.color || '#2f7cf6') + '55')); g.addColorStop(1, 'rgba(11,13,24,0)'); bg.fillStyle = g; bg.fillRect(0, 0, 540, 960); }

  const fs = (R.scenes || []).map(x => x.f), fAt = i => { for (let j = i; j >= 0; j--) if (fs[j] != null) return F(fs[j]); return 0; };

  if (s.kind === 'hook' && crash != null && t > crash) v = lerp(R.base || 100000, valAt(1), eo((t - crash) / 1.6));
  if (cover) v = R.base || 100000;
  const chg = v / (R.base || 100000) - 1, col = chg >= 0 ? '#21d07a' : '#ff3d55'; m.querySelector('.val').textContent = money(v); m.querySelector('.val').style.color = Math.abs(chg) < .005 ? '#fff' : col;
  const ch = m.querySelector('.chg'); ch.textContent = (chg >= 0 ? '+' : '') + Math.round(chg * 100) + '%'; ch.style.background = Math.abs(chg) < .005 ? 'rgba(255,255,255,.14)' : col; ch.style.color = Math.abs(chg) < .005 ? '#fff' : '#0b0d18';
  m.style.transform = `translateX(-50%) scale(${s.kind === 'hook' && !cover ? 0 : 1})`; m.style.visibility = s.kind === 'hook' && !cover ? 'hidden' : 'visible';
  // the hook's own big number follows the same money
  if (s.kind === 'hook' && B.parts.num) { B.parts.num.textContent = money(v); B.parts.num.style.color = v < (R.base || 100000) * .9995 ? '#ff3d55' : v > (R.base || 100000) * 1.0005 ? '#21d07a' : '#fff'; const p = ss(cl(t / .4)); B.parts.big.style.transform = `scale(${cover ? 1 : lerp(.86, 1, p) * (crash != null && t > crash && t < crash + .2 ? 1.08 : 1)})`;
    B.parts.hd.style.transform = `translateY(${cover ? 0 : (1 - eo(t / .35)) * -40}px)`; B.parts.hd.style.opacity = 1; }
  // counters
  if (s.kind === 'big' && B.parts.num) { const ta = B.a + .1, tb = Math.max(ta + .6, B.parts.t + .15), u = ss((t - ta) / (tb - ta)), val = lerp(s.from || 0, s.to, u); B.parts.num.textContent = (s.prefix || '') + (s.dec ? val.toFixed(s.dec) : Math.round(val).toLocaleString('en-US')) + (s.suffix || '');

    x.save(); x.translate(cxm, cym); x.rotate(ang); x.fillStyle = '#fff'; x.beginPath(); x.moveTo(0, -14); x.lineTo(rr - 50, 0); x.lineTo(0, 14); x.fill(); x.restore(); x.fillStyle = '#fff'; x.beginPath(); x.arc(cxm, cym, 30, 0, 7); x.fill();
    x.font = '800 150px Barlow'; x.textAlign = 'center'; x.fillText((s.prefix || '') + Math.round(val) + (s.suffix || ''), cxm, cym + 210); }
  if (s.kind === 'chart') drawChart(cx2, B.parts.f0, B.parts.f1, ss(lt / Math.max(.8, (B.b - B.a) * .75)), t);
  if (s.kind === 'hook') { cx2.save(); cx2.globalAlpha = .22; drawChart(cx2, 0, 1, cover ? 1 : eo(t / 1.6), t, true); cx2.restore(); }
  const show3 = s.kind === 'product' || s.kind === 'name'; prod.visible = show3;
  if (show3) { const u = back(cl(lt / .5)); prod.rotation.set(.18 + .05 * Math.sin(t), -.6 + lt * .55, 0); prod.position.set(0, s.kind === 'name' ? .95 : .9, 0); prod.scale.setScalar(prod.userData.s0 || (prod.userData.s0 = prod.scale.x)); prod.scale.multiplyScalar(Math.max(.001, u) * (s.kind === 'name' ? (R.product === 'car' || R.product === 'van' ? .5 : .4) : 1)); }

  if (!c) cp.innerHTML = ''; else { cp.innerHTML = c.words.map(w => { const said = t >= w.t0, k = said ? Math.max(0, 1 - (t - w.t0) / .18) : 0; return `<span class="cw" style="opacity:${said ? 1 : .4};color:${said ? (w.color || (w.hot ? '#ffc83d' : '#fff')) : '#fff'};transform:scale(${1 + .18 * k}) translateY(${-10 * k}px)">${w.text}</span>`; }).join(''); }

  const gc = $('#grain').getContext('2d'), id = gc.createImageData(360, 640), sd = Math.floor(t * 30) * 7.3; for (let i = 0; i < id.data.length; i += 4) { const v2 = hs(i * .013 + sd) * 255; id.data[i] = id.data[i + 1] = id.data[i + 2] = v2; id.data[i + 3] = 255; } gc.putImageData(id, 0, 0);
