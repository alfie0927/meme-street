<!doctype html>
<html><head><meta charset="utf-8">
<!-- The studio, 09:00 "a new way in": a real stock chart as a tug of war. Style: a pop-art game show (sunburst, Ben-Day dots,
     thick black outlines, flat colours). A HyperFrames composition: every word, price and time comes from window.__R
     (reel.json's props); the people are drawn in code. One paused GSAP timeline moves the words and cards; the rig, the rope
     and the chart are redrawn from the timeline's time on every update, so a frame is a pure function of its time. -->
<style>
@font-face{font-family:"MS";src:url("Montserrat.ttf") format("truetype");font-weight:100 900;font-style:normal}
html,body{margin:0;background:#141414}
#root{position:relative;width:1080px;height:1920px;overflow:hidden;background:#ffd21e;font-family:"MS",sans-serif;font-weight:900;color:#141414}
#root *{box-sizing:border-box}
#cam,#hud{position:absolute;left:0;top:0;width:1080px;height:1920px}
#cam{transform-origin:540px 1100px}
svg{position:absolute;left:0;top:0;overflow:visible}
#flash{position:absolute;left:0;top:0;width:1080px;height:1920px;background:#fff4d6;opacity:0}
.slot{position:absolute;left:0;width:1080px;display:flex;justify-content:center}
.strip{white-space:nowrap;line-height:1;text-align:center;transform:rotate(-1.5deg) scaleX(.8)}
.strip.a{font-size:70px;padding:9px 34px 11px;background:#141414;color:#fff4d6}
.strip.b{font-size:86px;padding:6px 36px 8px;background:#fff4d6;color:#141414;border:8px solid #141414;box-shadow:12px 12px 0 #141414;transform:rotate(1deg) scaleX(.8)}
.plate{position:absolute;top:1540px;height:54px;width:300px;display:flex;align-items:center;justify-content:center;gap:14px;font-size:44px;line-height:1;border:6px solid #141414;color:#141414}
.plate i{display:block;width:0;height:0;border-left:15px solid transparent;border-right:15px solid transparent}
.plate span{display:block;transform:scaleX(.84)}
#panel{position:absolute;left:70px;top:484px;width:940px;height:390px;background:#fff4d6;border:8px solid #141414;box-shadow:14px 14px 0 #141414}
#price{position:absolute;left:30px;top:4px;font-size:124px;line-height:1.06;white-space:nowrap;transform:scaleX(.9);transform-origin:0 50%}
#price b{display:inline-block;width:.64em;text-align:center;font-weight:900}
#price b.n{width:.3em}
#day{position:absolute;right:30px;top:14px;text-align:right;line-height:1;transform:scaleX(.84);transform-origin:100% 50%;white-space:nowrap}
#day .d1{font-size:66px}
#day .d2{font-size:44px;margin-top:6px;font-weight:800}
#plot{left:0;top:132px}
.date{position:absolute;bottom:6px;font-size:44px;font-weight:800;line-height:1;white-space:nowrap;transform:scaleX(.8)}
.burst{position:absolute;width:460px;height:200px}
#card{position:absolute;left:70px;top:256px;width:940px;height:632px;background:#fff4d6;border:8px solid #141414;box-shadow:14px 14px 0 #141414;overflow:hidden}
#card .in{position:absolute;left:36px;top:16px;width:1075px;transform:scaleX(.8);transform-origin:0 0}
#card .q{font-size:84px;line-height:1.03;text-wrap:balance}
#card .row{display:flex;align-items:center;gap:28px;margin-top:12px;font-size:72px;line-height:1;white-space:nowrap}
#card .row em{flex:none;display:flex;align-items:center;justify-content:center;width:92px;height:92px;border:7px solid #141414;border-radius:50%;font-style:normal;font-size:60px;box-shadow:6px 6px 0 #141414}
#card .cta{position:absolute;left:0;bottom:0;width:100%;height:84px;background:#141414;color:#fff4d6;display:flex;align-items:center;justify-content:center;font-size:56px;white-space:nowrap}
#card .cta span{display:block;transform:scaleX(.84)}
</style></head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="25" data-width="1080" data-height="1920" data-fps="30">
  <div id="cam">
    <svg id="bg" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
    <svg id="stage" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
    <div id="hud"></div>
  </div>
  <div id="flash"></div>
</div>
<script src="vendor/gsap.min.js"></script>
<script>
document.fonts.load('900 40px "MS"');            // (asked for before the player waits for document.fonts.ready)
window.__build = R => {
  'use strict';
  // ------------------------------------------------------------ the data (all of it from the reel)
  const P = R.prices, N = P.length - 1, p0 = P[0], pEnd = P[N], pMax = Math.max(...P), pMin = Math.min(...P);
  const T = R.T, MAP = R.map, B = R.beats, WIN = pEnd >= p0 ? 1 : -1;            // +1: the buyers (right) end ahead
  const C = Object.assign({ink: '#141414', paper: '#fff4d6', yel: '#ffd21e', pale: '#ffe680', buy: '#12c26b', sell: '#ff3a45'}, R.colors || {});

  const $ = s => document.querySelector(s), NS = 'http://www.w3.org/2000/svg';
  const S = (tag, at, par) => { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); if (par) par.appendChild(e); return e; };
  const H = (tag, cls, par, html) => { const e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; if (par) par.appendChild(e); return e; };
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), lerp = (a, b, u) => a + (b - a) * u, f1 = x => Math.round(x * 10) / 10;
  const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };      // (seeded: the same every run)
  const E = {heave: gsap.parseEase('power2.inOut'), out: gsap.parseEase('power3.out'), expo: gsap.parseEase('expo.out'), bounce: gsap.parseEase('bounce.out'), io: gsap.parseEase('power2.inOut'), back: gsap.parseEase('back.out(2)')};
  const MON = ['JAN', 'FEB', 'MAR', 'APR', 'MAY', 'JUN', 'JUL', 'AUG', 'SEP', 'OCT', 'NOV', 'DEC'];
  const date = s => { const [y, m, d] = String(s).split('-'); return `${+d} ${MON[+m - 1]} ${y}`; };
  const pct = Math.round((pEnd / p0 - 1) * 100), fill = s => String(s).replace('{WINNER}', WIN > 0 ? 'BUYERS' : 'SELLERS').replace('{NAME}', String(R.name || '').toUpperCase()).replace('{PCT}', (pct >= 0 ? '+' : '') + pct + '%');
  document.getElementById('root').dataset.duration = T;

  // ------------------------------------------------------------ time -> the price (dull stretches fast, the big swings slow: R.map)
  const idxAt = t => {
    if (t <= MAP[0][0]) return MAP[0][1];
    for (let k = 0; k < MAP.length - 1; k++) if (t < MAP[k + 1][0]) return lerp(MAP[k][1], MAP[k + 1][1], (t - MAP[k][0]) / (MAP[k + 1][0] - MAP[k][0]));
    return MAP[MAP.length - 1][1];
  };
  const at = x => { const i = Math.min(N - 1, Math.max(0, Math.floor(x))); return [i, E.heave(clamp(x - i))]; };      // (each day's move is one heave)

  // ------------------------------------------------------------ the stage's geometry
  const FLOOR = 1440, CS = 1, RH = 150, D0 = 124, SP = 100, WORLD = 380, FOLLOW = .72;
  const wx = p => WORLD * (p - p0) / (pMax - p0);                                 // a price's place on the floor (the rope's flag stands over it)
  const fw0 = t => wx(priceAt(t)), rate = t => (idxAt(t + .05) - idxAt(t - .05)) / .1;                 // days a second
  const fw = t => { const w = clamp(rate(t) / 150, .04, .13); return (fw0(t - w) + fw0(t - w / 2) + fw0(t) + fw0(t + w / 2) + fw0(t + w)) / 5; };      // (the rope is a heavy thing: in the fast stretches it follows the trend, not every tick)
  const FMID = (wx(pMin) + wx(pMax)) / 2;                                         // the frame is centred on the middle of the price range, so neither team is ever pulled out of it
  const camAt = t => FOLLOW * (fw(t) + fw(t - .1) + fw(t - .2) + fw(t - .3)) / 4 + (1 - FOLLOW) * FMID - 72 * WIN * E.io(clamp((t - TF - .1) / .6));         // the camera follows, a little late; after the bell it makes room for the heap
  const _adv = new Map(), adv = t => {                                           // -1..1: who is gaining ground (buyers +)

  };

  const zoomAt = t => 1 + .06 * (E.io(clamp((t - HOLD[0]) / (HOLD[1] - HOLD[0] - .1))) - E.expo(clamp((t - HOLD[1] - .38) / .35))) + PUNCH.reduce((a, [t0, t1, z]) => a + (z - 1) * (E.expo(clamp((t - t0) / .14)) - E.io(clamp((t - t1) / .3))), 0);

  // ------------------------------------------------------------ the backdrop: a sunburst and Ben-Day dots
  const bg = $('#bg'); S('rect', {width: 1080, height: 1920, fill: C.yel}, bg);
  const rays = S('g', {}, bg), CX = 540, CY = 1180, RR = 1900, NR = 14;
  for (let i = 0; i < NR; i++) {

    S('path', {d: `M${CX},${CY}L${f1(CX + RR * Math.cos(a0))},${f1(CY + RR * Math.sin(a0))}A${RR},${RR} 0 0 1 ${f1(CX + RR * Math.cos(a1))},${f1(CY + RR * Math.sin(a1))}Z`, fill: C.pale}, rays);
  }
  for (let row = 0, y = 4; y < 300; row++, y += 23) for (let x = (row % 2) * 11.5 - 4; x < 1090; x += 23) { const r = 9.2 * Math.pow(1 - y / 300, 1.15); if (r > .9) S('circle', {cx: f1(x), cy: y, r: f1(r), fill: C.ink}, bg); }

  // ------------------------------------------------------------ the stage: floor, price ruler, rope, people
  const st = $('#stage'), gZ = S('g', {}, st);
  S('rect', {x: -300, y: FLOOR, width: 1680, height: 94, fill: C.paper}, gZ); S('rect', {x: -300, y: FLOOR + 94, width: 1680, height: 500, fill: C.ink}, gZ);
  for (let row = 0, y = 1618; y < 1930; row++, y += 24) for (let x = (row % 2) * 12 - 6; x < 1090; x += 24) S('circle', {cx: x, cy: y, r: f1(1.5 + 8.5 * (y - 1618) / 300), fill: C.yel}, gZ);
  const gW = S('g', {}, gZ), ticks = [];
  for (let v = 0; v <= Math.ceil(pMax) + 8; v += .5) {

    S('rect', {x: x - (whole ? 4 : 2.5), y: FLOOR, width: whole ? 8 : 5, height: whole ? 28 : 15, fill: C.ink}, gW);
    if (whole) { const tx = S('text', {x, y: FLOOR + 76, 'text-anchor': 'middle', 'font-family': 'MS', 'font-weight': 900, 'font-size': 46, fill: C.ink}, gW); tx.textContent = '$' + v; ticks.push({x, tx}); }
  }
  S('rect', {x: -300, y: FLOOR - 5, width: 1680, height: 10, fill: C.ink}, gZ);                      // the floor's edge
  const gDustB = S('g', {}, gW), gBody = S('g', {}, gW);
  const ropeO = S('path', {fill: 'none', stroke: C.ink, 'stroke-width': 17, 'stroke-linecap': 'round', 'stroke-linejoin': 'round'}, gW);
  const ropeI = S('path', {fill: 'none', stroke: C.paper, 'stroke-width': 8, 'stroke-linecap': 'round', 'stroke-linejoin': 'round'}, gW);
  const ropeT = S('path', {fill: 'none', stroke: C.ink, 'stroke-width': 8, 'stroke-dasharray': '3 13'}, gW);
  const gFlag = S('g', {}, gW); S('path', {d: 'M-33,0L0,0L0,124Z', fill: C.sell}, gFlag); S('path', {d: 'M33,0L0,0L0,124Z', fill: C.buy}, gFlag); S('path', {d: 'M-33,0L33,0L0,124Z', fill: 'none', stroke: C.ink, 'stroke-width': 7, 'stroke-linejoin': 'round'}, gFlag); S('circle', {r: 14, fill: C.ink}, gFlag); S('circle', {r: 5, fill: C.paper}, gFlag);
  const gArms = S('g', {}, gW), gFx = S('g', {}, gW);

  const FACES = ['strain', 'shock', 'smug', 'joy', 'dizzy'];
  function makeFace(g) {
    const F = {}, o = (name) => (F[name] = S('g', {display: 'none'}, g));
    const ln = (g, d, w = 5.5) => S('path', {d, fill: 'none', stroke: C.ink, 'stroke-width': w, 'stroke-linecap': 'round', 'stroke-linejoin': 'round'}, g);
    let f = o('strain');                                                       // eyes screwed shut, teeth gritted
    ln(f, 'M-1,-15L12,-8L-1,-1'); ln(f, 'M38,-15L26,-8L38,-1'); ln(f, 'M-6,-30L15,-22', 7); ln(f, 'M42,-30L23,-22', 7);
    S('rect', {x: 2, y: 10, width: 36, height: 18, rx: 6, fill: '#fff', stroke: C.ink, 'stroke-width': 5}, f); ln(f, 'M2,19L38,19M14,10L14,28M26,10L26,28', 3.5);
    f = o('shock');                                                             // eyes wide, mouth an O
    S('circle', {cx: 6, cy: -9, r: 12.5, fill: '#fff', stroke: C.ink, 'stroke-width': 5}, f); S('circle', {cx: 31, cy: -10, r: 11, fill: '#fff', stroke: C.ink, 'stroke-width': 5}, f);
    S('circle', {cx: 9, cy: -8, r: 4.2, fill: C.ink}, f); S('circle', {cx: 33, cy: -9, r: 3.8, fill: C.ink}, f); ln(f, 'M-6,-33Q6,-41 16,-34', 6); ln(f, 'M24,-35Q34,-41 42,-33', 6);
    S('ellipse', {cx: 21, cy: 21, rx: 10, ry: 13.5, fill: C.ink}, f); S('ellipse', {cx: 21, cy: 27, rx: 5.5, ry: 5, fill: C.sell}, f);
    f = o('smug');                                                              // eyes open and hard, a toothy grin
    S('circle', {cx: 6, cy: -8, r: 11, fill: '#fff', stroke: C.ink, 'stroke-width': 5}, f); S('circle', {cx: 31, cy: -9, r: 10, fill: '#fff', stroke: C.ink, 'stroke-width': 5}, f);
    S('circle', {cx: 10, cy: -6, r: 5, fill: C.ink}, f); S('circle', {cx: 34, cy: -7, r: 4.6, fill: C.ink}, f); ln(f, 'M-8,-27L17,-17', 8); ln(f, 'M44,-27L22,-18', 8);
    S('path', {d: 'M0,10Q20,16 42,6Q40,32 18,32Q4,30 0,10Z', fill: '#fff', stroke: C.ink, 'stroke-width': 5, 'stroke-linejoin': 'round'}, f); ln(f, 'M3,21Q20,25 40,18M14,13L14,30M27,12L27,31', 3.5);
    f = o('joy');                                                               // eyes smiling shut, mouth wide open
    ln(f, 'M-6,-6Q4,-22 15,-6', 6.5); ln(f, 'M23,-7Q32,-22 42,-7', 6.5);
    S('path', {d: 'M-4,8Q20,14 44,6Q42,40 20,40Q0,38 -4,8Z', fill: C.ink, stroke: C.ink, 'stroke-width': 5, 'stroke-linejoin': 'round'}, f); S('path', {d: 'M2,11Q20,16 40,10L39,17Q20,22 3,18Z', fill: '#fff'}, f); S('ellipse', {cx: 21, cy: 33, rx: 10, ry: 6, fill: C.sell}, f);
    f = o('dizzy');                                                             // crossed-out eyes, a wobbly mouth
    ln(f, 'M-3,-17L15,-1M15,-17L-3,-1', 6); ln(f, 'M24,-17L40,-1M40,-17L24,-1', 6); ln(f, 'M0,22Q7,13 14,22T28,22T42,22', 6);
    S('path', {d: 'M22,24Q22,40 31,40Q39,40 38,24Z', fill: C.sell, stroke: C.ink, 'stroke-width': 4.5, 'stroke-linejoin': 'round'}, f);
    return F;
  }
  function makeHair(g, v, col) {                                                // six heads: a bowler, spikes, a bun, a cap, curls, a flat top
    const hat = S('g', {}, g), bald = S('g', {display: 'none'}, g);

      S('path', {d: 'M-31,-32L-27,-90L31,-90L35,-32Z', fill: C.ink, stroke: C.ink, 'stroke-width': 6, 'stroke-linejoin': 'round'}, hat); S('path', {d: 'M-32,-46L36,-46', stroke: C.yel, 'stroke-width': 11}, hat); S('path', {d: 'M-50,-30L54,-30', stroke: C.ink, 'stroke-width': 14, 'stroke-linecap': 'round'}, hat);
    } else if (v === 1) S('path', {d: 'M-45,-4L-64,-22L-46,-26L-60,-50L-36,-42L-38,-68L-16,-50L-4,-76L8,-50L28,-64L26,-40L42,-36L30,-26L-18,-30Z', fill: C.ink, stroke: C.ink, 'stroke-width': 4, 'stroke-linejoin': 'round'}, hat);
    else if (v === 2) { S('circle', {cx: -30, cy: -54, r: 19, fill: C.ink}, hat); S('path', {d: 'M-46,6C-56,-40 -22,-54 10,-48C24,-46 34,-38 40,-28C12,-36 -14,-30 -22,-8C-26,2 -34,10 -46,6Z', fill: C.ink}, hat); }
    else if (v === 3) { S('path', {d: 'M-45,-14C-46,-62 36,-66 43,-20Z', fill: C.yel, stroke: C.ink, 'stroke-width': 6, 'stroke-linejoin': 'round'}, hat); S('path', {d: 'M34,-27L82,-19L82,-9L36,-14Z', fill: C.yel, stroke: C.ink, 'stroke-width': 6, 'stroke-linejoin': 'round'}, hat); }
    else if (v === 4) [[-42, -4, 15], [-40, -26, 17], [-24, -44, 18], [0, -52, 18], [22, -44, 16], [-50, 14, 12]].forEach(([cx, cy, r]) => S('circle', {cx, cy, r, fill: C.ink}, hat));
    else { S('path', {d: 'M-44,-16L-40,-66L30,-66L38,-34Z', fill: C.ink, stroke: C.ink, 'stroke-width': 4, 'stroke-linejoin': 'round'}, hat); S('path', {d: 'M-43,-18L41,-30', stroke: col, 'stroke-width': 11}, hat); }

  }
  const limb = (par, w, col) => { const o = S('path', {fill: 'none', stroke: C.ink, 'stroke-width': w + 11, 'stroke-linecap': 'round', 'stroke-linejoin': 'round'}, par); const i = col ? S('path', {fill: 'none', stroke: col, 'stroke-width': w, 'stroke-linecap': 'round', 'stroke-linejoin': 'round'}, par) : null; return d => { o.setAttribute('d', d); if (i) i.setAttribute('d', d); }; };
  function makeChar(s, k, i) {

    c.stripe = S('path', {fill: 'none', stroke: C.paper, 'stroke-width': 10}, c.gr);
    c.head = S('g', {}, c.gr);
    S('circle', {cx: 44, cy: 6, r: 10, fill: skin, stroke: C.ink, 'stroke-width': 5.5}, c.head);                     // the nose
    S('circle', {r: 44, fill: skin, stroke: C.ink, 'stroke-width': 6.5}, c.head);
    S('circle', {cx: -14, cy: 6, r: 8.5, fill: skin, stroke: C.ink, 'stroke-width': 5}, c.head);                     // the ear
    [[-2, 22], [7, 27], [-4, 33], [5, 38]].forEach(([cx, cy]) => S('circle', {cx: cx - 10, cy: cy - 4, r: 3.1, fill: C.sell}, c.head));        // a Ben-Day cheek
    c.faces = makeFace(c.head); Object.assign(c, makeHair(c.head, (s > 0 ? 3 : 0) + k, col));
    c.sweat = [0, 1].map(() => S('path', {d: 'M0,-10C6,-2 7,5 0,8C-7,5 -6,-2 0,-10Z', fill: '#fff', stroke: C.ink, 'stroke-width': 3.5, display: 'none'}, c.gr));
    c.ga = S('g', {}, gArms); c.gar = S('g', {}, c.ga);
    c.armB = limb(c.gar, 14, skin); c.armF = limb(c.gar, 14, skin);
    c.hands = [0, 1].map(() => S('circle', {r: 13.5, fill: skin, stroke: C.ink, 'stroke-width': 5.5}, c.gar));
    return c;
  }
  const chars = []; [-1, 1].forEach(s => [2, 1, 0].forEach(k => chars.push(makeChar(s, k, chars.length))));
  const dust = Array.from({length: 54}, () => S('circle', {fill: C.paper, stroke: C.ink, 'stroke-width': 5, display: 'none'}, gDustB));
  const hatOwner = R.hat ? chars.find(c => c.k === 0 && c.s === (adv(R.hat.t + .15) > 0 ? -1 : 1)) : null;
  const flyHat = S('g', {display: 'none'}, gFx); if (hatOwner) makeHair(flyHat, hatOwner.s > 0 ? 3 : 0, hatOwner.col);
  const star = 'M0,-24L6,-8L24,-8L10,3L15,21L0,10L-15,21L-10,3L-24,-8L-6,-8Z';
  const stars = [0, 1, 2].map(() => S('path', {d: star, fill: C.yel, stroke: C.ink, 'stroke-width': 5, 'stroke-linejoin': 'round', display: 'none'}, gFx));
  const lines = [0, 1, 2, 3].map(() => S('path', {fill: 'none', stroke: C.ink, 'stroke-width': 7, 'stroke-linecap': 'round', display: 'none'}, gFx));

  // two-bone joint: from a to b with bones l1, l2, bent towards (bx, by)

    lines.forEach((e, j) => { if (!ls || te > 0) return e.setAttribute('display', 'none'); const x = F + ls * (D0 + 2 * SP + 150 + 18 * hash(j + Math.floor(t * 12))), y = FLOOR - 60 - j * 46, len = 50 + 60 * hash(j * 5 + Math.floor(t * 12)); e.setAttribute('display', 'inline'); e.setAttribute('d', `M${f1(x)},${y}L${f1(x + ls * len)},${y}`); });
    // the hat: it stays where the head was when the rope was yanked
    if (hatOwner && t >= R.hat.t && t < R.hat.t + 1.4) {
      const r0 = rig(hatOwner, R.hat.t), u = t - R.hat.t, c = hatOwner;
      flyHat.setAttribute('display', 'inline'); flyHat.setAttribute('transform', `translate(${f1(r0.X + c.f * CS * r0.Hd[0] - c.f * 600 * u)},${f1(FLOOR + CS * r0.Hd[1] - 30 - 700 * u + 1150 * u * u)}) rotate(${f1(-c.f * 520 * u)}) scale(${CS})`);
    } else flyHat.setAttribute('display', 'none');
    stars.forEach((e, j) => { if (te < .95) return e.setAttribute('display', 'none'); const a = t * 3.4 + j * 2.094, lc = rs[chars.findIndex(c => c.s !== WIN && c.k === 1)], sc = E.back(clamp((te - .95 - j * .08) / .3)); e.setAttribute('display', 'inline'); e.setAttribute('transform', `translate(${f1(lc.X - WIN * 96 + Math.cos(a) * 130)},${f1(FLOOR - 318 + Math.sin(a) * 24)}) rotate(${f1(t * 140 + j * 40)}) scale(${f1(sc * (.8 + .2 * Math.sin(a)))})`); });
    // the chart panel: the same price, drawing itself
    const x = idxAt(t), [i, e] = at(x), px = lerp(cx(i), cx(i + 1), e), py = cy(lerp(P[i], P[i + 1], e)), started = t > T0;
    let pd = `M${f1(cx(0))},${f1(cy(P[0]))}`; for (let k = 1; k <= i; k++) pd += `L${f1(cx(k))},${f1(cy(P[k]))}`; pd += `L${f1(px)},${f1(py)}`;
    lineO.setAttribute('d', pd); area.setAttribute('d', pd + `L${f1(px)},${PY1 + 6}L${f1(cx(0))},${PY1 + 6}Z`);
    for (let k = 0; k < N; k++) segs[k].setAttribute('display', k < i ? 'inline' : 'none');
    segH.setAttribute('d', `M${f1(cx(i))},${f1(cy(P[i]))}L${f1(px)},${f1(py)}`); segH.setAttribute('stroke', P[i + 1] >= P[i] ? C.buy : C.sell);
    dot.setAttribute('cx', f1(px)); dot.setAttribute('cy', f1(py)); const pu = (t * 1.6) % 1; ring.setAttribute('cx', f1(px)); ring.setAttribute('cy', f1(py)); ring.setAttribute('r', f1(15 + 26 * pu)); ring.setAttribute('stroke-opacity', f1(1 - pu));
    const ps = '$' + lerp(P[i], P[i + 1], e).toFixed(2); if (ps !== lastPrice) { lastPrice = ps; priceEl.innerHTML = ps.split('').map(ch => ch === '.' ? '<b class="n">.</b>' : `<b>${ch}</b>`).join(''); }
    const ds = 'DAY ' + (started ? Math.min(N, Math.floor(x + .001)) : 0); if (ds !== lastDay) { lastDay = ds; dayNum.textContent = ds; }
    if (counter) { const v = Math.round(pct * E.expo(clamp((t - counter.t) / counter.d))); counter.el.textContent = (v >= 0 ? '+' : '') + v + '%'; }
  }
  tl.eventCallback('onUpdate', () => draw(tl.time()));
  window.addEventListener('hf-seek', e => draw(e.detail.time));
  window.__timelines = {main: tl}; draw(0);
};
