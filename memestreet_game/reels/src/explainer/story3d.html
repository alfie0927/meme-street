<!doctype html>
<html><head><meta charset="utf-8">
<!-- Meme Street's story reel in 3D (story3d.js): the same script and grid as story.js, each sentence its own low-poly 3D set,
     the camera flying from set to set. Layers: the 3D (drawn at 720x1280, scaled up), then the 2D overlay (story.js: header,
     date pill, stamps, counters, tags, captions). 1080x1920. -->
<style>
@font-face{font-family:'Fredoka';src:url('fonts/Fredoka.ttf') format('truetype');font-weight:300 700}
@font-face{font-family:'Montserrat';src:url('../oneshot/fonts/Montserrat.ttf') format('truetype');font-weight:100 900}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden;background:#11121f}
#gl{position:absolute;left:0;top:0;width:1080px;height:1920px}
#c{position:absolute;left:0;top:0}
</style></head>
<body>
<canvas id="gl"></canvas>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="../oneshot/vendor/three.min.js"></script>
<script src="../oneshot/vendor/GLTFLoader.js"></script>
<script src="../oneshot/vendor/SkeletonUtils.js"></script>
<script src="../oneshot/vendor/CopyShader.js"></script>
<script src="../oneshot/vendor/BokehShader.js"></script>
<script src="../oneshot/vendor/EffectComposer.js"></script>
<script src="../oneshot/vendor/MaskPass.js"></script>
<script src="../oneshot/vendor/RenderPass.js"></script>
<script src="../oneshot/vendor/ShaderPass.js"></script>
<script src="../oneshot/vendor/BokehPass.js"></script>
<script src="story.js"></script>
<script src="models3d.js"></script>
<script src="story3d.js"></script>
</body></html>
