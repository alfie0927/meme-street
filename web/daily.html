<!doctype html>
<!-- memestreet.net since 2026-11-18: Meme Street, the daily stock chart game, and nothing else (the owner: "route the daily
     to memestreet.net. that's ALL there should be"; then "rehaul the whole website so it looks more fluid and dynamic. our
     aim is to get returning players"). One real stock a day, the same for everyone; two minutes to trade it; at the end its
     name, its timeframe and the levels it tested. The server (game/daily.py) runs the game: the candles still to come never
     reach the browser. No account needed (a visitor's streak lives under this browser's id, ms_vid); an account keeps it
     everywhere, with a weekly streak freeze, the history and the archive of past charts (replayed here, unranked).
     pages.py puts the title, description and preview in at the HEAD marker below (never name the marker in a
     comment: the first one is replaced, and in here it hid the title from browsers until 2026-11-19) and the opening words in <main id="main">. -->
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--HEAD-->
<meta name="theme-color" content="#07090c">
<link rel="icon" href="/favicon.ico" sizes="any"><link rel="icon" type="image/png" sizes="48x48" href="/brand/icon-48.png"><link rel="icon" type="image/png" sizes="192x192" href="/brand/icon-192.png"><link rel="apple-touch-icon" href="/brand/apple-touch-icon.png"><link rel="manifest" href="/manifest.json">
<style>
:root{--bg:#0b1117;--card:#111a22;--card2:#15202a;--line:#1e2a35;--line2:#2c3a47;--txt:#e6edf3;--mut:#8c9aa7;--acc:#4cc3cc;--acc2:#f5a524;--amb:#f5a524;--up:#3fcf8e;--dn:#f2555a;--flat:#2a333d;--ice:#8fd3ff;--mono:"JBM",ui-monospace,"SF Mono",Menlo,Consolas,monospace;--ease:cubic-bezier(.2,.8,.2,1)}
@font-face{font-family:"JBM";src:url(/brand/jetbrains-mono.woff2) format("woff2");font-weight:100 800;font-display:swap}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--txt);font:14.5px/1.6 var(--mono);font-variant-numeric:tabular-nums;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body{position:relative;background:transparent;min-height:100vh;overflow-x:hidden;caret-color:var(--acc);scrollbar-color:#2a3540 var(--bg)}
::selection{background:#4cc3cc4d;color:var(--txt)}
a{text-underline-offset:3px}
/* the background: a faint terminal grid and two slow, dim glows */
.bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
.bgfx i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;filter:blur(90px);opacity:.07;animation:drift 26s ease-in-out infinite alternate}
.bgfx i:nth-child(1){background:var(--acc);left:-25vmax;top:-30vmax}.bgfx i:nth-child(2){background:var(--acc2);right:-30vmax;bottom:-35vmax;animation-duration:32s;animation-direction:alternate-reverse}
/* the market behind the page (the owner, 2026-11-19: "a 'stock' background similar to how Krillion has a background"):
   a faint candle feed along the bottom that keeps printing, and price-zone notes in the margins like Krillion's depths */
#bgc{position:fixed;inset:0;width:100%;height:100%;z-index:-1;pointer-events:none;transition:opacity .6s}
body.trading #bgc{opacity:.35}
.bgfx b{position:absolute;inset:0;background-image:linear-gradient(#ffffff07 1px,transparent 1px),linear-gradient(90deg,#ffffff07 1px,transparent 1px);background-size:32px 32px;mask-image:radial-gradient(ellipse at 50% 15%,#000 20%,transparent 70%)}
body.final .bgfx i:nth-child(1){background:var(--dn);opacity:.14}
@keyframes drift{to{transform:translate(12vmax,9vmax) scale(1.15)}}
a{color:var(--acc)}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line2);background:var(--card);border-radius:6px;padding:10px 14px;touch-action:manipulation;transition:transform .12s var(--ease),border-color .2s,background .2s,box-shadow .2s}
button:hover{border-color:#3d4a57}button:active{transform:scale(.96)}button:focus-visible,input:focus-visible{outline:2px solid var(--acc);outline-offset:2px}button:disabled{opacity:.5;cursor:default}
input{width:100%;background:#070a0e;border:1px solid var(--line2);border-radius:6px;padding:12px;margin:0 0 12px;transition:border-color .2s}input:focus{border-color:var(--acc)}
.up{color:var(--up)}.dn{color:var(--dn)}.mut{color:var(--mut)}
/* the header: the name, the buttons, and under them the status bar (today's board as a ticker tape, the UTC clock) */
header{position:sticky;top:0;z-index:5;display:grid;grid-template-columns:96px 1fr 96px;align-items:center;padding:10px max(16px,calc(50% - 344px)) 0;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);background:#0b1117e6;border-bottom:1px solid var(--line)}
header h1{margin:0;text-align:center;font:800 18px/1 var(--mono);letter-spacing:.26em;white-space:nowrap;cursor:pointer;color:var(--txt)}header h1 b{color:var(--acc);font-weight:800}
@keyframes shine{from{background-position:100% 0}to{background-position:-200% 0}}
.hl,.hr{display:flex;gap:6px}.hr{justify-content:flex-end}
.ic{width:38px;height:38px;padding:0;border-radius:6px;font-weight:800;display:grid;place-items:center;background:#ffffff06}
#sbar{grid-column:1/-1;display:flex;align-items:center;gap:14px;margin-top:10px;padding:8px 0;border-top:1px solid var(--line);font:500 12px/1 var(--mono);color:var(--mut);white-space:nowrap;overflow:hidden}
#sbar .sl{color:var(--amb)}#sbar .sl i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--up);margin-right:7px;vertical-align:1px;animation:blink 2s ease-in-out infinite}@keyframes blink{50%{opacity:.25}}
.tape{flex:1;min-width:0;overflow:hidden;mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);-webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
.tape>div{display:inline-flex;animation:tape 40s linear infinite}.tape span{padding-right:30px}.tape b{font-weight:700}
@keyframes tape{to{transform:translateX(-50%)}}
#utc{color:var(--txt);font-variant-numeric:tabular-nums}
main{max-width:720px;margin:0 auto;padding:30px 16px 40px}
.view{animation:fadein .3s var(--ease) both}@keyframes enter{from{opacity:0;transform:translateY(14px)}}
.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:4px;background:#ffb02010;border:1px solid #ffb0203d;color:var(--amb);font:600 12px/1 var(--mono);}
.hero{text-align:center;padding:26px 0 8px}
.tag{font-size:clamp(27px,6.8vw,42px);font-weight:800;line-height:1.12;margin:0 0 22px;letter-spacing:-.035em;text-wrap:balance}
.tag span{display:block;animation:enter .6s var(--ease) both}.tag span:nth-child(2){animation-delay:.12s}.tag span:nth-child(3){animation-delay:.24s;color:var(--acc)}
.hero p{color:var(--mut);margin:0 auto 30px;max-width:500px;font-size:16px}
.quote{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:0 auto 36px;max-width:560px;text-align:left}
.quote div{background:var(--card);padding:13px 14px}
.quote small{display:block;font:500 12px/1 var(--mono);color:var(--mut);margin-bottom:9px}
.quote b{font:700 16px/1 var(--mono);font-variant-numeric:tabular-nums}
.yday{margin:44px auto 0;max-width:500px;padding:14px 18px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--mut);text-align:left;font-size:14px}.yday b{color:var(--txt)}
.streak{display:inline-flex;align-items:center;gap:8px;margin:0 0 22px;padding:7px 14px;border-radius:6px;background:#ffb02012;border:1px solid #ffb02050;color:#ffd27a;font-weight:800}
.flame{display:inline-block;color:#ffb347;animation:flick 1.4s ease-in-out infinite;transform-origin:50% 90%}@keyframes flick{50%{transform:scale(1.15) rotate(-4deg)}}
.chal{margin:0 auto 22px;max-width:500px;padding:12px 14px;border-radius:8px;background:#4cc3cc12;border:1px solid #4cc3cc50}
.go{position:relative;background:linear-gradient(135deg,var(--acc),#62d6c0);border:0;color:#021012;font:800 17px/1 var(--mono);padding:18px 48px;border-radius:8px;box-shadow:0 8px 30px #4cc3cc33}
.go:hover{box-shadow:0 10px 40px #4cc3cc5c}
.go.pulse::after{content:"";position:absolute;inset:-4px;border-radius:10px;border:2px solid var(--acc);animation:ring 1.8s var(--ease) infinite}@keyframes ring{from{opacity:.8;transform:scale(1)}to{opacity:0;transform:scale(1.15)}}
.alt{background:#ffffff05;border-color:#4cc3cc55;color:var(--acc);font:700 13px/1.2 var(--mono);border-radius:6px;padding:12px 18px}
/* the run */
.top{display:flex;justify-content:space-between;align-items:center;margin:0 0 14px;gap:14px}
.tring{position:relative;width:76px;height:76px;flex:none}.tring svg{transform:rotate(-90deg)}
.tring .t{position:absolute;inset:0;display:grid;place-items:center;font:900 20px/1 var(--mono);font-variant-numeric:tabular-nums}
.tring.low .t{color:var(--dn)}.tring.low{animation:beat 1s ease-in-out infinite}@keyframes beat{50%{transform:scale(1.06)}}
.label{color:var(--amb);font:600 13px/1.3 var(--mono);margin-bottom:4px}
.pnl{text-align:right}.pnl .ret{font:900 30px/1 var(--mono);transition:color .3s}.pnl .eq{color:var(--mut);font:13px var(--mono);margin-top:4px}
.chart{position:relative;background:#0d151c;border:1px solid var(--line);border-radius:8px;padding:6px;overflow:hidden}
.chart .nc{transform-box:fill-box;transform-origin:50% 100%;animation:grow .4s var(--ease)}@keyframes grow{from{transform:scaleY(0);opacity:0}}
.chart .pop{transform-box:fill-box;transform-origin:center;animation:popin .45s var(--ease)}@keyframes popin{from{transform:scale(0)}60%{transform:scale(1.4)}}
.chart .lv{animation:fadein 1s var(--ease) both}@keyframes fadein{from{opacity:0}}
.pos{margin:12px 0;color:var(--mut);font-size:14px;text-align:center;min-height:21px;transition:color .3s}.pos b{color:var(--txt)}
.sizes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 10px}
.sizes button{padding:11px 0;font:700 14px/1 var(--mono);background:#ffffff05}.sizes button.on{border-color:var(--acc);color:var(--acc);background:#4cc3cc14;box-shadow:inset 0 0 0 1px var(--acc)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btns button{position:relative;overflow:hidden;padding:20px 0;font:900 20px/1 var(--mono);border-radius:8px;display:flex;justify-content:center;align-items:baseline;gap:8px}
.btns small{font-size:11px;opacity:.55;font-weight:700}
.buy{background:linear-gradient(180deg,#3fcf8e26,#3fcf8e10);border-color:#3fcf8e70;color:var(--up)}.sell{background:linear-gradient(180deg,#f2555a26,#f2555a10);border-color:#f2555a70;color:var(--dn)}
.btns button .rip{position:absolute;border-radius:50%;background:currentColor;opacity:.3;transform:scale(0);animation:rip .6s ease-out forwards;pointer-events:none}@keyframes rip{to{transform:scale(4);opacity:0}}
/* the overlays: the countdown before Play, "time's up" at the end */
#ov{position:fixed;inset:0;z-index:8;display:none;place-items:center;pointer-events:none;background:#0b111799}
#ov b{font:800 clamp(90px,30vw,180px)/1 var(--mono);color:var(--acc);animation:zoom .8s var(--ease) both}
#ov b.word{font-size:clamp(44px,13vw,80px)}
@keyframes zoom{from{transform:scale(2.2);opacity:0}25%{opacity:1}to{transform:scale(.9);opacity:0}}
/* the result */
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:26px 22px;margin:0 0 20px;text-align:center}
.kick{color:var(--mut);font:500 13px/1.3 var(--mono);}
.flip{perspective:900px;margin:0 0 20px}.flip>div{position:relative;transform-style:preserve-3d;transition:transform .9s var(--ease);min-height:150px}
.flip.open>div{transform:rotateY(180deg)}
.flip .f,.flip .b{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:8px;padding:22px;display:flex;flex-direction:column;justify-content:center;text-align:center}
.flip .f{background:repeating-linear-gradient(45deg,#4cc3cc10 0 12px,#f5a52410 12px 24px),var(--card);border:1px solid var(--line)}
.flip .f b{font:900 42px var(--mono)}.flip .b{transform:rotateY(180deg);background:linear-gradient(160deg,#101c22,#0a0e13);border:1px solid #4cc3cc50;position:relative;min-height:150px}
.name{font-size:32px;font-weight:900;margin:6px 0 4px;line-height:1.1}.name span{font:800 15px var(--mono);color:var(--amb);margin-left:8px}
.when{color:var(--mut);font-size:14px}.real{margin-top:10px;font:17px var(--mono);font-variant-numeric:tabular-nums}
.tf{display:inline-flex;gap:6px;align-items:center;margin-top:12px;padding:6px 12px;border-radius:6px;background:#f5a5241a;border:1px solid #f5a52450;color:#ffd58a;font-size:13px;font-weight:700}
.ev{margin:12px 0 0;font-size:14px;color:#c9d4dd}
.big{font:900 56px/1.05 var(--mono);margin:10px 0 4px}
.place{font-size:15px;margin:4px 0 0}.vs{margin:10px 0 0}
.grid{display:flex;justify-content:center;gap:6px;margin:20px 0 6px}
.grid i{width:30px;height:30px;border-radius:4px;display:block}.grid i.u{background:var(--up)}.grid i.d{background:var(--dn)}.grid i.f{background:var(--flat)}
.grid.anim i{animation:flipsq .5s var(--ease) both}@keyframes flipsq{from{transform:rotateX(90deg)}}
.best{color:var(--mut);font-size:14px;margin:14px 0 0}
.stat{display:grid;grid-template-columns:repeat(5,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:22px 0 0;text-align:center}
.stat>div{background:#0d151c;padding:15px 4px 13px}
.stat strong{display:block;font:700 clamp(15px,4.4vw,21px)/1.1 var(--mono);white-space:nowrap;font-variant-numeric:tabular-nums;margin-bottom:7px}.stat small{color:var(--mut);font:500 11px/1.25 var(--mono);display:block}
.acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:24px 0 0}
.acts button{display:inline-flex;align-items:center;justify-content:center;gap:9px;height:48px;padding:0 20px;font-size:14px;font-weight:700;border-radius:4px;letter-spacing:0}
.acts .go{padding:0 26px;font-size:15px}.acts .alt{color:var(--txt);border-color:var(--line2)}.acts .alt svg{color:var(--acc)}
.acts .alt:hover{border-color:var(--acc);background:#4cc3cc0d}
@media(max-width:520px){.acts button{flex:1 1 100%}.acts .alt{flex:1 1 40%}}
.sheet{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:6px 0 0}
.sheet a,.sheet button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 6px;border:1px solid var(--line2);border-radius:4px;color:var(--txt);text-decoration:none;font-size:13px;font-weight:600;background:transparent}
.sheet a:hover,.sheet button:hover{border-color:var(--acc)}.sheet i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:800;color:#fff;font-size:15px}
.shtxt{white-space:pre-wrap;background:#0b1117;border:1px solid var(--line);border-radius:4px;padding:12px;font-size:13px;margin:0 0 16px}
.steps{margin:0;padding-left:20px}.steps li{margin:0 0 10px}
.row{display:flex;gap:12px;justify-content:center;margin:22px 0 0;flex-wrap:wrap}
.next{color:var(--mut);margin:16px 0 0;font-size:14px}.next b{color:var(--txt);font-family:var(--mono);font-variant-numeric:tabular-nums}
.back{display:flex;justify-content:space-between;gap:10px 18px;flex-wrap:wrap;margin:0 0 20px;padding:14px 18px;border-radius:8px;background:#4cc3cc12;border:1px solid #4cc3cc40;font-size:14px}.back .cd{font-variant-numeric:tabular-nums}
.tmr{display:flex;align-items:center;gap:16px;text-align:left;background:linear-gradient(120deg,#f5a52414,#4cc3cc0c);border-color:#f5a52440}
.tmr .ring{flex:none;width:64px;height:64px}.tmr h2{margin:0 0 4px;font-size:17px}.tmr p{margin:0;color:var(--mut);font-size:14px}.tmr .cd{font-family:var(--mono)}
.mile{border-color:#ffb02060;background:linear-gradient(120deg,#ffb0201a,#ff6a2010)}.mile b{font-size:28px}
.ice{color:var(--ice)}
/* a section title, like a terminal panel's: small, amber, a rule running out to the right */
h3{display:flex;align-items:center;gap:10px;font:700 14px/1.2 var(--mono);color:var(--amb);margin:36px 0 14px}
h3::before{content:"";flex:none;width:6px;height:6px;background:var(--amb)}h3::after{content:"";flex:1;height:1px;background:var(--line)}
h3 .mut{font-weight:400}
.lvls{text-align:left;font-size:14px;padding:8px 20px}.lvls div{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}.lvls div:last-of-type{border:0}
.lvls i{flex:none;width:10px;height:10px;border-radius:50%}.lvls .px{font-family:var(--mono);font-variant-numeric:tabular-nums;margin-left:auto;color:var(--txt)}
.lvls .key{margin:4px 0 8px;padding-top:12px;border-top:1px solid var(--line);color:var(--mut);font-size:12.5px;display:flex;gap:16px;flex-wrap:wrap}
.curve svg{display:block;width:100%;height:auto;overflow:visible}
.curve .dt{transform-box:fill-box;transform-origin:center;animation:popin .45s var(--ease) both}
.beat{font:600 16px/1.4 var(--mono);color:var(--txt);margin:0 0 14px;text-align:left}.beat b{color:var(--acc);font-weight:800}
.dkey{display:flex;gap:18px;flex-wrap:wrap;margin:10px 0 0;color:var(--mut);font-size:12px;text-align:left}.dkey i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:0}
.dsum{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin:18px 0 0;background:var(--line);border:1px solid var(--line);border-radius:3px;overflow:hidden;text-align:left}
.dsum>div{background:#0d141a;padding:11px 12px}.dsum small{display:block;color:var(--mut);font-size:11.5px;margin-bottom:5px}.dsum b{font:700 15px/1 var(--mono)}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:11px 6px;border-bottom:1px solid var(--line)}td.r{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}tr.me td{background:#4cc3cc12}.rk{width:34px;color:var(--mut);font-weight:800}.rk.m0{color:#f5c84c}.rk.m1{color:#c9d3dc}.rk.m2{color:#d8955b}
.pitch{text-align:left;background:linear-gradient(160deg,#4cc3cc14,#f5a5240c);border-color:#4cc3cc50}
.pitch h2{margin:0 0 8px;font-size:20px}.pitch ul{margin:0 0 20px;padding-left:20px}.pitch li{margin:0 0 7px}
#pop{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:16px;z-index:9;backdrop-filter:blur(4px)}
#pop.on{display:flex;animation:fadein .2s}
#pop>div{background:var(--card2);border:1px solid var(--line2);border-top:2px solid var(--acc);border-radius:10px;max-width:500px;width:100%;max-height:90vh;overflow:auto;padding:30px 26px 26px;position:relative;animation:rise .35s var(--ease)}@keyframes rise{from{transform:translateY(30px) scale(.97);opacity:0}}
#pop h2{margin:0 0 14px;font-size:22px}#pop ul{padding-left:20px;margin:0}#pop li{margin:0 0 10px}
#pop .who{margin:-8px 0 22px;color:var(--mut)}
.x{position:absolute;top:14px;right:14px;width:36px;height:36px;padding:0;border:0;background:none;font-size:24px;color:var(--mut)}
.tabs{display:flex;gap:6px;margin:0 0 16px}.tabs button{flex:1;padding:10px}.tabs button.on{border-color:var(--acc);color:var(--acc)}
.err{color:var(--dn);font-size:13px;min-height:18px;margin:0 0 6px}.okmsg{color:var(--up);font-size:13px;margin:0 0 6px}
.small{color:var(--mut);font-size:13px;margin:18px 0 0}.hero .small{margin:22px auto 0}#pop .stat{margin-top:4px}
.lnk{background:none;border:0;padding:0;color:var(--acc);text-decoration:underline;font-size:inherit}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
#pop>div.auth{padding:0;max-width:440px;overflow-x:hidden}.auth .x{z-index:1}
.ahead{position:relative;padding:22px 26px 18px;background:linear-gradient(180deg,#17232e,#121b24);border-bottom:1px solid var(--line);overflow:hidden}
.ahead>*{position:relative}.ahead h2{margin:14px 0 8px;font-size:23px;letter-spacing:-.02em}.ahead p{margin:0;font-size:13px}
.ahead .deco{position:absolute;right:44px;top:0;width:56%;height:100%;opacity:.26;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,transparent 15%,#000 90%);mask-image:linear-gradient(90deg,transparent 15%,#000 90%)}
.badge{display:inline-flex;align-items:center;gap:7px;color:var(--acc);font:800 11.5px/1 var(--mono);letter-spacing:.12em;text-transform:uppercase;padding:4px 8px;border:1px solid #4cc3cc55;border-radius:3px;background:#0b1117cc}
.badge i{width:7px;height:7px;border-radius:50%;background:var(--acc);animation:blink 1.6s ease-in-out infinite}
.perks{display:flex;flex-wrap:wrap;gap:4px 16px;color:var(--mut)}.perks span::before{content:"✓ ";color:var(--up);font-weight:800}
.abody{padding:20px 26px 24px}.abody .small{text-align:center;font-size:12px;margin:16px 0 0;text-wrap:balance}

function signedIn(j,isNew){token=j.token;try{localStorage.ms_token=token}catch(e){}closePop();toast(isNew?`Welcome, ${j.name}: your streak is safe`:`Welcome back, ${j.name}`,3000);if(isNew)confetti();D=null;load()}
async function signOut(quiet){if(!quiet&&token)await fetch('/api/logout',{method:'POST',headers:{'X-Token':token}}).catch(()=>{});token=null;try{localStorage.removeItem('ms_token')}catch(e){}closePop();if(!quiet){D=null;load()}}
async function historyPop(){
 const r=await api('/api/daily/history');if(r.error){toast(r.error);return}
 pop(`<h2>Your history</h2>${r.rows.length?`<table><tbody><tr class="mut"><td>#</td><td>Stock</td><td class="r">You</td><td class="r">Stock</td></tr>${r.rows.map(x=>`<tr><td class="mut">${x.number}</td><td>${esc(x.name||x.ticker||'a mystery chart')}</td><td class="r ${cls(x.ret)}"><b>${pc(x.ret)}</b></td><td class="r ${cls(x.hold)}">${pc(x.hold)}</td></tr>`).join('')}</tbody></table>`:'<p class="mut">Your games will show up here.</p>'}`,'Your history')}
async function archivePop(){
 const r=await api('/api/daily/archive');if(r.error){toast(r.error);if(r.need_account)account('register');return}
 pop(`<h2>The archive</h2><p class="mut" style="margin:0 0 14px">Replay any past day. Just practice, not ranked.</p>${r.days.length?`<table><tbody>${r.days.map(x=>`<tr><td class="mut">#${x.number}</td><td>${esc(x.name)}<br><small class="mut">${esc(fmtDate(x.start))}</small></td><td class="r">${x.mine===null||x.mine===undefined?'':`<span class="${cls(x.mine)}">${pc(x.mine)}</span>`}</td><td class="r"><button class="alt" data-replay="${x.number}" style="padding:6px 14px">Play</button></td></tr>`).join('')}</tbody></table>`:'<p class="mut">Past days show up here from tomorrow.</p>'}`,'The archive')}
function sbar(){
 const e=$('tape');if(!e||!D)return;
 const base=[`<span>Daily #${D.number}: <b>${players()}</b> played</span>`].concat(!(G&&G.done)?['<span>Results show after you play</span>']:D.board.length?D.board.slice(0,12).map(x=>`<span>${esc(x.name)} <b class="${cls(x.ret)}">${pc(x.ret)}</b></span>`):['<span>No results yet. Be the first.</span>']);
 let items=base;while(items.length<8)items=items.concat(base);const html=items.join('');
 if(e._h!==html){e._h=html;e.innerHTML=`<div style="animation-duration:${items.length*3.5}s">${html}${html}</div>`}}
// ---- the market behind the page: a candle feed that prints a new candle every couple of seconds and scrolls left, a
// moving average through it and the last price blinking at its edge. It is scenery, with no prices on it; it dims while
// you trade, stops while the tab is hidden, and stands still for anyone who asks for less motion
const BG={c:[],off:0,t:0,seed:0};
function bgRand(){BG.seed=(BG.seed*1664525+1013904223)>>>0;return BG.seed/4294967296}
function bgCandle(){const p=BG.c.length?BG.c[BG.c.length-1][3]:100;
 if(!BG.trend||bgRand()<.06)BG.trend=(bgRand()-.5)*.9;   // (a new leg now and then, so it trends and ranges like a market)
 const o=p,cl=Math.max(20,o+BG.trend+(bgRand()-.5)*3.2),h=Math.max(o,cl)+bgRand()*1.6,l=Math.min(o,cl)-bgRand()*1.6;BG.c.push([o,h,l,cl])}
function bgDraw(){
 const cv=$('bgc');if(!cv)return;const dpr=Math.min(2,devicePixelRatio||1),w=innerWidth,h=innerHeight;
 if(cv.width!==Math.round(w*dpr)||cv.height!==Math.round(h*dpr)){cv.width=Math.round(w*dpr);cv.height=Math.round(h*dpr)}
 const x=cv.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);x.clearRect(0,0,w,h);
 const step=PHONE?9:12,n=Math.ceil(w/step)+3;while(BG.c.length<n)bgCandle();
 const cs=BG.c.slice(-n),lo=Math.min(...cs.map(c=>c[2])),hi=Math.max(...cs.map(c=>c[1])),top=h*.5,bot=h*.94,Y=v=>bot-(v-lo)/(hi-lo||1)*(bot-top);
 const X=i=>w-(n-1-i)*step-BG.off-step;
 cs.forEach((c,i)=>{const up=c[3]>=c[0],xx=X(i);x.globalAlpha=.13;x.fillStyle=x.strokeStyle=up?'#3fcf8e':'#f2555a';
  x.beginPath();x.moveTo(xx+step*.35,Y(c[1]));x.lineTo(xx+step*.35,Y(c[2]));x.lineWidth=1;x.stroke();
  x.fillRect(xx,Y(Math.max(c[0],c[3])),step*.7,Math.max(1,Math.abs(Y(c[0])-Y(c[3]))))});
 x.globalAlpha=.22;x.strokeStyle='#4cc3cc';x.lineWidth=1.5;x.beginPath();
 cs.forEach((c,i)=>{if(i<9)return;const a=cs.slice(i-9,i+1).reduce((s,k)=>s+k[3],0)/10;i===9?x.moveTo(X(i)+step*.35,Y(a)):x.lineTo(X(i)+step*.35,Y(a))});x.stroke();
 const ly=Y(cs[cs.length-1][3]);x.globalAlpha=.16+.08*Math.sin(BG.t/400);x.strokeStyle='#f5a524';x.setLineDash([3,5]);x.beginPath();x.moveTo(0,ly);x.lineTo(w,ly);x.stroke();x.setLineDash([]);
 const fade=x.createLinearGradient(0,top-40,0,top+h*.2);fade.addColorStop(0,'#0b1117');fade.addColorStop(1,'#0b111700');x.globalAlpha=1;x.fillStyle=fade;x.fillRect(0,top-41,w,h*.2+42)}
function bgLoop(t){
 if(!document.hidden){const dt=Math.min(100,t-(BG.t||t));BG.t=t;BG.off+=dt*(PHONE?.006:.008);
  const step=PHONE?9:12;while(BG.off>=step){BG.off-=step;bgCandle();if(BG.c.length>400)BG.c.splice(0,200)}
  const last=BG.c[BG.c.length-1];if(last){const d=(bgRand()-.5)*.5;last[3]=Math.max(20,last[3]+d);last[1]=Math.max(last[1],last[3]);last[2]=Math.min(last[2],last[3])}   // (the newest candle is still forming)
  bgDraw()}else BG.t=0;
 requestAnimationFrame(bgLoop)}
function bgStart(){BG.seed=(Math.floor(Date.now()/864e5)*2654435761)>>>0;for(let i=0;i<260;i++)bgCandle();bgDraw();if(!CALM)requestAnimationFrame(bgLoop);addEventListener('resize',bgDraw)}
function rails(){
 const L=$('railL'),R=$('railR');if(!L||!R||!D)return;const st=D.stats||{};
 const day=d=>new Date(d*864e5).toLocaleDateString(undefined,{day:'numeric',month:'short',timeZone:'UTC'});
 L.innerHTML=`<div class="rt">Recent days</div>`+((D.past||[]).length?D.past.map(p=>{const w=p.top&&p.top[0];return `<div class="rr"><span class="mut">${day(p.day)}</span><span class="nm">${w?esc(w.name):'–'}</span><b class="${w?cls(w.ret):''}">${w?pc(w.ret):''}</b></div>`}).join('')+'<p class="rn">Each day\'s winner and their return.</p>':'<p class="rn">Past days show here from tomorrow.</p>');
 R.innerHTML=`<div class="rt">Your desk</div>`+[['Streak',`${st.streak||0} day${st.streak===1?'':'s'}`],['Best streak',st.max_streak||0],['Played',st.played||0],['Average',st.avg==null?'–':`<span class="${cls(st.avg)}">${pc(st.avg)}</span>`],['Best return',st.best==null?'–':`<span class="${cls(st.best)}">${pc(st.best)}</span>`],['Beat the stock',st.played?Math.round(st.beat/st.played*100)+'%':'–']].map(([k,v])=>`<div class="rr"><span class="mut">${k}</span><b>${v}</b></div>`).join('')
  +`<div class="rr nx"><span class="mut">Next stock</span><b class="cd">${hms(D.next-Date.now()/1000)}</b></div>`}
function installHelp(){
 const ua=navigator.userAgent,ios=/iPhone|iPad|iPod/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1),android=/Android/.test(ua);
 const steps=ios?['Tap the <b>Share</b> button at the bottom of Safari (the square with an arrow).','Scroll down and tap <b>Add to Home Screen</b>.','Tap <b>Add</b>. Meme Street opens like an app from now on.']
  :android?['Tap the <b>⋮</b> menu at the top right of Chrome.','Tap <b>Add to Home screen</b> (or <b>Install app</b>).','Tap <b>Add</b>.']
  :['In Chrome or Edge, click the <b>install</b> icon at the right end of the address bar, or open the <b>⋮</b> menu.','Choose <b>Install Meme Street</b> (Edge: <b>Apps → Install this site as an app</b>).','It opens in its own window, and you can pin it to your taskbar.'];
 pop(`<h2>Add Meme Street to your ${ios||android?'home screen':'computer'}</h2><ol class="steps">${steps.map(x=>`<li>${x}</li>`).join('')}</ol>${ios&&!/Safari/.test(ua)?'<p class="small">On an iPhone this works from Safari, so open memestreet.net there first.</p>':''}`,'Add to home screen')}
let toastT=null;function toast(t,ms){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>e.classList.remove('on'),ms||1600)}

window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEv=e});
document.addEventListener('click',async e=>{const t=e.target;
 if(t.closest('[data-close]')||t.id==='pop'){closePop();return}
 if(t.closest('#help-btn')||t.closest('#how')){help();return}
 if(t.closest('#home')){if(P){P=null;stop()}drawn='';load();return}
 if(t.closest('#stats-btn')){if(D)statsPop();return}
 if(t.closest('#acct-btn')){if(D)account(D.visitor?'register':null);return}
 const am=t.closest('[data-acct]');if(am){account(am.dataset.acct);return}
 const md=t.closest('[data-mode]');if(md){authMode=md.dataset.mode;pendingCode=false;drawAuth();return}
 if(t.closest('#auth-go')){authGo();return}
 if(t.closest('#rec-send')){const j=await post('/api/account/forgot',{name:($('nm')||{}).value||''});$('amsg').textContent=j.msg||'';$('aerr').textContent=j.error||'';return}
 if(t.closest('#signout')){signOut();return}
 const op=t.closest('[data-open]');if(op){op.dataset.open==='history'?historyPop():archivePop();return}
 const rp=t.closest('[data-replay]');if(rp){replay(Number(rp.dataset.replay));return}
 if(t.closest('#back')){P=null;drawn='';load();return}
 if(t.closest('#play')){start();return}
 if(t.closest('#share')){share();return}
 if(t.closest('#pic')){picture();return}
 if(t.closest('#install')){if(installEv){const ev=installEv;installEv=null;ev.prompt();try{const r=await ev.userChoice;if(r.outcome==='accepted'){toast('Added to your home screen');t.closest('#install').remove()}}catch(e){}return}installHelp();return}
 if(t.closest('#copyres')){try{await navigator.clipboard.writeText(shareText());toast('Copied: paste it anywhere')}catch(e){toast('Could not copy')}return}
 if(t.closest('#remind')){const r=await api('/api/daily/remind',{on:!D.remind});if(r.ok){D.remind=r.remind;document.querySelectorAll('#remind').forEach(b=>b.textContent=D.remind?'Daily email is on: turn off':'Email me when the next stock is out')}toast(r.msg||r.error||'Error',4000);return}
 const s=t.closest('[data-size]');if(s){size=Number(s.dataset.size);lsSet('ms_daily_size',size);buzz(8);if(P)pfill();else draw();return}
 const b=t.closest('[data-side]');if(b)trade(b.dataset.side,b)});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){closePop();return}
 if(e.key==='Enter'&&e.target.closest&&e.target.closest('#auth')){e.preventDefault();authGo();return}
 const live=P?!P.done:(G&&!G.done&&D&&D.status==='running');
 if(!live||e.ctrlKey||e.metaKey||e.altKey||/INPUT|TEXTAREA/.test(e.target.tagName))return;const k=e.key.toLowerCase();
 if(k==='b'){e.preventDefault();trade('buy',document.querySelector('[data-side=buy]'))}else if(k==='s'){e.preventDefault();trade('sell',document.querySelector('[data-side=sell]'))}
 else if(k.length===1&&'1234'.includes(k)){size=SIZES[Number(k)-1];lsSet('ms_daily_size',size);if(P)pfill();else draw()}});
setInterval(()=>{const u=$('utc');if(u)u.textContent=new Date().toISOString().slice(11,19)+' UTC';if(!D)return;const left=D.next-Date.now()/1000;document.querySelectorAll('.cd').forEach(e=>e.textContent=hms(left));if(left<=0&&!P&&!(G&&!G.done)){D=null;load()}},1000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&D&&!P&&D.status!=='running')load()});
bgStart();load();
