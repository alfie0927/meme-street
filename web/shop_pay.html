<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08090b">
<title>Test checkout · Meme Street</title><link rel="icon" type="image/png" href="/brand/memestreet_logo_peaks.png">
<style>
:root{--bg:#08090b;--card:#0d1013;--line:#262d33;--txt:#dce3e8;--mut:#7d8a93;--up:#3ad07a;--dn:#f25c54;--acc:#4cc3cc}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.6 ui-monospace,"Cascadia Mono","SF Mono",Consolas,"Liberation Mono",Menlo,monospace;display:grid;place-items:center;min-height:100vh;padding:16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:3px;padding:22px;width:min(420px,100%)}
h1{font:700 18px ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;margin:0 0 6px}.mut{color:var(--mut)}.warn{color:#ffd990;border-left:2px solid #ffc65c;padding:6px 12px;font-size:14px;margin:12px 0}
.row{display:flex;gap:10px;margin-top:16px}button{flex:1;font:600 14px ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace;padding:9px;border-radius:2px;border:1px solid var(--line);background:#161b20;color:var(--txt);cursor:pointer}
button.pay{background:var(--up);border-color:var(--up);color:#04140a}#msg{margin-top:12px}
</style></head><body><div class="box">
<h1>Test checkout</h1>
<p class="mut">This is the pretend payment page used while the shop is in <b>test mode</b>. No money is taken. On the live site this page is replaced by the payment provider's own page.</p>
<div id="what" class="mut">Loading the order…</div>
<div class="warn">Test mode only: pressing Pay completes the order without any payment.</div>
<div class="row"><button class="pay" id="pay">Pay (test)</button><button id="cancel">Cancel</button></div>
<p id="msg"></p>
</div>
<script>
const q=new URLSearchParams(location.search),order=q.get('order')||'';let token=null;try{token=localStorage.ms_token}catch(e){}
const $=id=>document.getElementById(id);
async function call(path,body){const r=await fetch(path,{method:body?'POST':'GET',headers:Object.assign({'X-Token':token||''},body?{'Content-Type':'application/json'}:{}),body:body?JSON.stringify(body):undefined});return r.json().catch(()=>({error:'error'}))}
(async()=>{if(!token){$('what').textContent='Sign in first.';return}
 const o=await call('/api/shop/order/'+encodeURIComponent(order));
 if(o.error){$('what').textContent='This order was not found.';return}
 $('what').innerHTML=`<b>${o.kind==='pro'||o.kind==='expert'?'Meme Street '+(o.kind==='pro'?'Pro':'Expert')+', '+o.days+' days':Number(o.mb).toLocaleString()+' MB'}</b> for <b>${o.price}</b> · order ${o.id} · ${o.status}`;
 if(o.status!=='pending'){$('pay').disabled=$('cancel').disabled=true}})();
async function act(action){$('pay').disabled=$('cancel').disabled=true;const r=await call('/api/shop/test_pay',{order,action});$('msg').textContent=r.msg||r.error||'';setTimeout(()=>location.href='/shop'+(action==='pay'&&r.ok?'?paid='+order:'?cancelled='+order),900)}
$('pay').onclick=()=>act('pay');$('cancel').onclick=()=>act('cancel');
</script></body></html>
